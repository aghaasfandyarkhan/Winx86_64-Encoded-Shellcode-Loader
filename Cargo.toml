[package]
name = "shellcodeloader"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "http2", "rustls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

[profile.release.package."*"]
opt-level = "z"
